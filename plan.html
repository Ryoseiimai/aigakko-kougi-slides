<html lang="ja">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI初心者向け 講義動画企画｜ホリエモンAI学校</title>
<style>
:root{
  --ink:#1a2230; --sub:#475066; --line:#e3e7ef;
  --bg:#ffffff; --bg-soft:#f6f8fb; --paper:#fff;
  --accent:#1f5fbf; --accent-deep:#163f7d; --accent-soft:rgba(31,95,191,.08);
  --ok:#0f9d7a; --warn:#c9492f; --gold:#b3892f;
  --c-learn:#b3892f;  --c-learn-soft:#fbf2dd;
  --c-cowork:#0f9d7a; --c-cowork-soft:#e6f6f1;
  --c-code:#1f5fbf;   --c-code-soft:#e9f1fb;
  --c-rest:#7a7f9a;   --c-rest-soft:#eef0f6;
  --radius:16px; --radius-sm:12px; --pill:999px;
  --shadow:0 8px 30px rgba(22,40,70,.08);
  --shadow-sm:0 3px 12px rgba(22,40,70,.06);
  --maxw:1120px;
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
body{line-height:1.8;}
.hero{background:linear-gradient(180deg,#f4f8fe 0%,#fff 100%);}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; font-size:16px;}
a{color:inherit;}
img{max-width:100%; display:block;}
h1,h2,h3,h4{line-height:1.4; margin:0; font-weight:700; letter-spacing:.01em;}
h1{font-size:clamp(26px,4.6vw,42px); line-height:1.3;}
h2{font-size:clamp(22px,3.2vw,30px);}
h3{font-size:18px;}
p{margin:0;}
.lead{color:var(--sub); font-size:17px; max-width:760px;}
.center{text-align:center;}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px; width:100%;}
.section{padding:60px 0;}
.section-soft{background:var(--bg-soft);}

.btn{display:inline-block; text-decoration:none; cursor:pointer; font:inherit; font-weight:700; border:0; border-radius:var(--pill); padding:14px 32px; font-size:16px; transition:transform .15s, box-shadow .2s, background .2s, filter .15s;}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 8px 22px var(--accent-soft);}
.btn-primary:hover{background:var(--accent-deep); transform:translateY(-1px);}

.toolbar{position:sticky; top:0; z-index:50; display:flex; gap:10px; align-items:center; padding:10px 16px;
  background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);}
.toolbar .t{font-weight:700; font-size:14px; color:var(--sub); margin-right:auto;}
.toolbar button{font:inherit; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:var(--paper); color:var(--ink); padding:7px 14px; border-radius:var(--radius-sm); transition:.15s;}
.toolbar button:hover{border-color:var(--accent); color:var(--accent);}
.toolbar button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.toolbar button.primary:hover{filter:brightness(1.06); color:#fff;}

.eyebrow{display:inline-block; font-size:13px; font-weight:700; letter-spacing:.12em; color:var(--accent); background:var(--accent-soft); padding:6px 14px; border-radius:var(--pill); margin-bottom:16px;}
.badge{display:inline-block; background:var(--accent); color:#fff; font-weight:700; font-size:12px; letter-spacing:.1em; padding:5px 14px; border-radius:var(--pill);}
.chip{font-size:12px; font-weight:700; padding:4px 12px; border-radius:var(--pill); display:inline-block;}
.chip.learn{background:var(--c-learn-soft); color:var(--c-learn);}
.chip.cowork{background:var(--c-cowork-soft); color:var(--c-cowork);}
.chip.code{background:var(--c-code-soft); color:var(--c-code);}
.chip.rest{background:var(--c-rest-soft); color:var(--c-rest);}
.chip-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}

.card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; box-shadow:var(--shadow-sm);}
.card.lead-bar{border-left:5px solid var(--accent);}
.card .ic{width:32px; height:4px; border-radius:2px; background:var(--accent);}
.card h3{font-size:17px; margin:12px 0 8px;}
.card p{color:var(--sub); font-size:14.5px;}
.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:36px;}

.sec-head{text-align:center; max-width:780px; margin:0 auto 10px;}
.sec-head h2{margin-bottom:12px;}

.hero{padding:56px 0 50px; border-bottom:1px solid var(--line);}
.hero h1 .hl{color:var(--accent);}
.hero .sub{color:var(--sub); font-size:clamp(15px,1.8vw,18px); margin-top:20px; max-width:700px;}

.tbl{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:14px;}
.tbl th,.tbl td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
.tbl th{background:var(--bg-soft); color:var(--sub); font-size:11.5px; letter-spacing:.06em;}
.tbl td.k{font-weight:700; white-space:nowrap; color:var(--ink);}

.timeline{position:relative; margin-top:34px; padding-left:96px;}
.timeline::before{content:""; position:absolute; left:78px; top:8px; bottom:8px; width:2px; background:var(--line);}
.slot{position:relative; margin-bottom:14px;}
.slot .time{position:absolute; left:-96px; top:14px; width:74px; text-align:right; font-size:12.5px; font-weight:700; color:var(--sub); line-height:1.35;}
.slot .dot{position:absolute; left:-22px; top:18px; width:14px; height:14px; border-radius:50%; background:var(--paper); border:3px solid var(--accent); z-index:1;}
.slot .card{border-left:5px solid var(--accent); padding:16px 20px;}
.slot .card h3{margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.slot .card p{margin:6px 0 0; font-size:13.5px;}
.slot.stage1 .dot{border-color:var(--c-learn);} .slot.stage1 .card{border-left-color:var(--c-learn);}
.slot.stage2 .dot{border-color:var(--c-code);} .slot.stage2 .card{border-left-color:var(--c-code);}
.slot.stage3 .dot{border-color:var(--c-cowork);} .slot.stage3 .card{border-left-color:var(--c-cowork);}
.slot.stage4 .dot{border-color:var(--c-rest);} .slot.stage4 .card{border-left-color:var(--c-rest);}

.note{font-size:13px; color:var(--sub); background:var(--bg-soft); border-radius:var(--radius-sm); padding:12px 16px; margin:16px 0 0;}
.note.tip{border-left:4px solid var(--accent); background:var(--accent-soft);}

.footer-cta{background:linear-gradient(135deg,var(--accent-deep),var(--accent)); color:#fff; text-align:center; padding:64px 0;}
.footer-cta h2,.footer-cta p{color:#fff;}
.footer-cta p{opacity:.9; margin-top:14px; font-size:16px;}
.footer-cta .foot-tag{margin-top:26px; font-size:13px; opacity:.85; letter-spacing:.08em;}

/* ===== 講義回カード（各回共通レイアウト） ===== */
.lecture{display:grid; grid-template-columns:1fr 1.5fr; gap:36px; align-items:start; margin-top:28px;}
.lecture-left .badge{margin-bottom:16px;}
.lecture-left h2{margin-bottom:10px;}
.lecture-left .lead{font-size:15.5px;}
.lecture-right{display:flex; flex-direction:column; gap:10px;}
.lrow{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; box-shadow:var(--shadow-sm);}
.lrow .lab{font-size:11.5px; font-weight:700; letter-spacing:.1em; color:var(--accent); margin-bottom:8px; display:block;}
.lrow ul{margin:0; padding-left:18px; color:var(--sub); font-size:14px; line-height:1.6;}
.lrow p.val{color:var(--ink); font-size:14.5px; font-weight:600;}
.lrow p.summary{color:var(--ink); font-size:16px; font-weight:500; line-height:1.6;}
.time-chip{display:inline-block; margin-top:14px; background:var(--bg-soft); color:var(--sub); font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:var(--pill);}
@media(max-width:820px){ .lecture{grid-template-columns:1fr;} }

.pageno{position:absolute; top:18px; left:22px; font-size:12px; font-weight:700; color:var(--sub); letter-spacing:.05em;}
.slide{position:relative;}

@media print{
  body{background:#fff;}
  .toolbar{display:none;}
  .wrap{margin:0; max-width:none;}
  .card{box-shadow:none !important;}
  .section{padding:16px 0;}
  .card,.slot{break-inside:avoid;}
}
@media print{
  body.deck .section{
    break-after:page; page-break-after:always; break-inside:avoid;
    min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:6vh 8vw;
  }
  body.deck .section:last-of-type{break-after:auto; page-break-after:auto;}
  body.deck h1{font-size:34pt;} body.deck h2{font-size:26pt;}
  body.deck .lead,body.deck p{font-size:13pt;}
  body.deck .lrow ul, body.deck .lrow p.val{font-size:12pt;}
  @page{ size:A4 landscape; margin:0; }
}
body.deck .section{border-bottom:1px solid var(--line);}

@media(max-width:820px){
  .section{padding:44px 0;}
  .lead{font-size:15px;}
}
@media(max-width:680px){
  .lecture{grid-template-columns:1fr;}
}
@media(max-width:560px){
  .wrap{padding:0 16px;}
  .timeline{padding-left:64px;} .timeline::before{left:50px;}
  .slot .time{left:-64px; width:46px; font-size:11px;} .slot .dot{left:-18px;}
}
</style>
</head>

      { "step": "確認", "owner": "企画：今井／確認：運営", "eta": "1日" },
      { "step": "公開", "owner": "企画：今井／確認：運営", "eta": "1日" }
    ],
    "note": "ひと言：まず第1回を1本作って形を固め、残り6本を同じ型で量産する。"
  },
  "closing": {
    "heading": "知る → 使う → 広げる、を7本で。",
    "text": "初心者が、自分の仕事で成果を出し、会社に広げるところまで。",
    "cta": "まず第1回の台本から着手します",
    "footer": "ホリエモンAI学校"
  }
};
</script>

<div class="toolbar">
  <span class="t" id="toolbarTitle">AI初心者向け 講義動画企画</span>
  <button onclick="window.print()" class="primary">印刷 / PDF保存</button>
</div>

<div id="deck-root"></div>

<script>
(function render(deck){
  document.title = deck.meta.docTitle || document.title;
  document.getElementById('toolbarTitle').textContent = deck.meta.title.replace(/<br\s*\/?>/g,' ');

  const root = document.getElementById('deck-root');
  const sections = [];
  let pageIndex = 0;
  const total = 3 + deck.lectures.length + 4; // cover+aim+map + N lectures + after+format+process+closing

  function esc(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function pageNoHtml(){
    pageIndex++;
    return '<span class="pageno">' + pageIndex + ' / ' + total + '</span>';
  }
  function softClass(){ return (pageIndex % 2 === 0) ? ' section-soft' : ''; }

  // 1. 表紙
  sections.push(
    '<section class="section slide"><div class="wrap center">' +
      pageNoHtml() +
      '<span class="eyebrow">' + esc(deck.meta.eyebrow) + '</span>' +
      '<h1>' + deck.meta.title + '</h1>' +
      '<p class="lead center" style="margin:22px auto 0;">' + esc(deck.meta.subtitle) + '</p>' +
      '<p style="margin-top:40px; color:var(--sub); font-size:13.5px; font-weight:700;">' + esc(deck.meta.date) + '</p>' +
    '</div></section>'
  );

  // 2. 狙い
  (function(){
    const cards = deck.aim.cards.map(c =>
      '<div class="card lead-bar"><div class="ic"></div><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></div>'
    ).join('');
    sections.push(
      '<section class="section slide' + softClass() + '"><div class="wrap">' +
        pageNoHtml() +
        '<div class="sec-head"><span class="eyebrow">' + esc(deck.aim.eyebrow) + '</span><h2>' + esc(deck.aim.heading) + '</h2></div>' +
        '<p class="lead" style="font-size:24px; margin:0 0 28px;">' + esc(deck.aim.lead) + '</p>' +
        '<div class="card-grid">' + cards + '</div>' +
      '</div></section>'
    );
  })();

  // 3. 全体マップ
  (function(){
    const stages = deck.map.stages.map(s =>
      '<div class="slot ' + esc(s.stageClass) + '"><div class="time">' + esc(s.label) + '</div><div class="dot"></div>' +
      '<div class="card"><h3>' + esc(s.title) + ' <span class="chip ' + esc(s.chipClass) + '">' + esc(s.chip) + '</span></h3><p>' + esc(s.text) + '</p></div></div>'
    ).join('');
    const rows = deck.lectures.map(l =>
      '<tr><td class="k">' + esc(l.n) + '</td><td>' + esc(l.title) + '</td><td>' + esc(l.goal) + '</td></tr>'
    ).join('');
    sections.push(
      '<section class="section slide' + softClass() + '"><div class="wrap">' +
        pageNoHtml() +
        '<div class="sec-head"><span class="eyebrow">' + esc(deck.map.eyebrow) + '</span><h2>' + esc(deck.map.heading) + '</h2></div>' +
        '<div class="timeline">' + stages + '</div>' +
        '<table class="tbl"><tr><th>回</th><th>タイトル</th><th>ゴール</th></tr>' + rows + '</table>' +
      '</div></section>'
    );
  })();

  // 4〜(3+N). 各回
  deck.lectures.forEach(l => {
    const learnItems = l.learn.map(t => '<li>' + esc(t) + '</li>').join('');
    sections.push(
      '<section class="section slide' + softClass() + '"><div class="wrap">' +
        pageNoHtml() +
        '<div class="lecture">' +
          '<div class="lecture-left">' +
            '<span class="badge">' + esc(l.n) + '</span> ' +
            '<span class="chip ' + esc(l.stageClass) + '">' + esc(l.stage) + '</span>' +
            '<h2>' + esc(l.title) + '</h2>' +
            '<p class="lead">' + esc(l.tagline) + '</p>' +
          '</div>' +
          '<div class="lecture-right">' +
            '<div class="lrow"><span class="lab">企画書の内容</span><p class="summary">' + esc(l.summary) + '</p></div>' +
            '<div class="lrow"><span class="lab">学ぶこと</span><ul>' + learnItems + '</ul></div>' +
            '<div class="lrow"><span class="lab">動画のゴール</span><p class="val">' + esc(l.goal) + '</p></div>' +
            '<div class="lrow"><span class="lab">持ち帰る成果物</span><p class="val">' + esc(l.output) + '</p></div>' +
            '<span class="time-chip">目安 ' + esc(l.minutes) + '</span>' +
          '</div>' +
        '</div>' +
      '</div></section>'
    );
  });

  // 受講後の姿
  (function(){
    const cards = deck.after.cards.map(c =>
      '<div class="card lead-bar"><div class="ic"></div><h3>' + esc(c.title) + '</h3><p>' + esc(c.text) + '</p></div>'
    ).join('');
    sections.push(
      '<section class="section slide' + softClass() + '"><div class="wrap">' +
        pageNoHtml() +
        '<div class="sec-head"><span class="eyebrow">' + esc(deck.after.eyebrow) + '</span><h2>' + esc(deck.after.heading) + '</h2></div>' +
        '<div class="card-grid">' + cards + '</div>' +
      '</div></section>'
    );
  })();

  // 共通フォーマット
  (function(){
    const steps = deck.format.steps.map(s =>
      '<div class="slot"><div class="time">' + esc(s.time) + '</div><div class="dot"></div>' +
      '<div class="card"><h3>' + esc(s.title) + '</h3><p>' + esc(s.text) + '</p></div></div>'
    ).join('');
    sections.push(
      '<section class="section slide' + softClass() + '"><div class="wrap">' +
        pageNoHtml() +
        '<div class="sec-head"><span class="eyebrow">' + esc(deck.format.eyebrow) + '</span><h2>' + esc(deck.format.heading) + '</h2></div>' +
        '<div class="timeline">' + steps + '</div>' +
        '<div class="note tip">' + esc(deck.format.note) + '</div>' +
      '</div></section>'
    );
  })();

  // 制作の進め方
  (function(){
    const head = '<tr>' + deck.process.columns.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>';
    const rows = deck.process.rows.map(r =>
      '<tr><td class="k">' + esc(r.step) + '</td><td>' + esc(r.owner) + '</td><td>' + esc(r.eta) + '</td></tr>'
    ).join('');
    sections.push(
      '<section class="section slide' + softClass() + '"><div class="wrap">' +
        pageNoHtml() +
        '<div class="sec-head"><span class="eyebrow">' + esc(deck.process.eyebrow) + '</span><h2>' + esc(deck.process.heading) + '</h2></div>' +
        '<table class="tbl">' + head + rows + '</table>' +
        '<div class="note tip">' + esc(deck.process.note) + '</div>' +
      '</div></section>'
    );
  })();

  // 締め
  (function(){
    pageIndex++;
    sections.push(
      '<section class="footer-cta slide"><div class="wrap center">' +
        '<span class="pageno" style="color:#fff; opacity:.85;">' + pageIndex + ' / ' + total + '</span>' +
        '<h2>' + esc(deck.closing.heading) + '</h2>' +
        '<p>' + esc(deck.closing.text) + '</p>' +
        '<p class="foot-tag">' + esc(deck.closing.cta) + '</p>' +
        '<p class="foot-tag" style="margin-top:36px; font-weight:700;">' + esc(deck.closing.footer) + '</p>' +
      '</div></section>'
    );
  })();

  root.innerHTML = sections.join('\n');
})(DECK);
</script>

</body>
</html>
</content>
