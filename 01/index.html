<script>const LECTURE = {
  "school": "ホリエモンAI学校",
  "series": "AI初心者向け 講義動画",
  "no": 1,
  "title": "ChatGPT Astraとは？",
  "subtitle": "AIに「おつかい」を任せる時代がきた",
  "slides": [
    {
      "type": "title"
    },
    {
      "type": "goal",
      "heading": "今日のゴール",
      "items": [
        "Astraが何かを、ひと言で言える",
        "「エージェント」が何かが分かる",
        "今日、1つだけAIにお願いしてみる"
      ]
    },
    {
      "type": "statement",
      "big": "Astraは、ChatGPTの「新しい頭脳」です。",

    {
      "type": "metaphor",
      "heading": "何が変わった？ たとえで言うと",

      "right": {
        "label": "Astra",

        "desc": "目的を伝えると、手順を考えて、最後までやってくれる。"

        [
          "1回ずつ指示する",
          "まとめて任せられる"
        ],
        [

    {
      "type": "statement",

    },
    {
      "type": "statement",
      "big": "Codex（コーデックス）＝作業を頼める助手",
      "sub": "アプリ作りやパソコン作業を、言葉で頼める。プログラムの知識は不要。まずは Work から始めればOK。"
    },
    {
      "type": "steps",
      "heading": "使い始め方 3ステップ",
      "items": [
        {
          "title": "ChatGPTにログイン",
          "desc": "スマホでもパソコンでもOK。"
        },
        {
          "title": "プランを確認",
          "desc": "Plus（月20ドル）以上で使えます。"

        {
          "title": "Work を開いて、お願いを打つ",

    {

    {
      "type": "scenes",
      "heading": "すぐ試せるお願い（事務・営業）",
      "items": [
        {
          "who": "事務",
          "text": "この議事録から、担当と締切を表にして"
        },
        {
          "who": "事務",
          "text": "この売上表を、月別に集計して"
        },
        {
          "who": "営業",
          "text": "この商談メモから、お礼メールの下書きを作って"
        },
        {
          "who": "営業",
          "text": "この商品資料から、提案書を3枚にまとめて"
        }
      ]
    },
    {
      "type": "scenes",
      "heading": "すぐ試せるお願い（経営者）",
      "items": [
        {
          "who": "経営",
          "text": "この収支表から、改善案を3つ出して"
        },
        {
          "who": "経営",
          "text": "新しい事業の案を、良い点・悪い点で整理して"
        },
        {
          "who": "全員",
          "text": "この文章を、中学生にも分かるように直して"
        }
      ]
    },
    {
      "type": "caution",
      "heading": "使うときの注意 3つ",
      "items": [
        {
          "title": "数字や事実は、人が確認する",
          "desc": "もっともらしい間違いをすることがあります。"
        },
        {
          "title": "個人情報や機密は、会社のルールに従う",
          "desc": "入れていい情報かを先に確認。詳しくは第4回で。"
        },
        {
          "title": "送信・購入・削除は、実行前に確認する",
          "desc": "任せきりにせず、最後のボタンは人が押す。"
        }
      ]
    },
    {
      "type": "todo",
      "heading": "今日やってみること",
      "big": "手元の資料を1つ渡して、「表にまとめて」とお願いする。",
      "sub": "それだけでOK。うまくいかなくても大丈夫です。"
    },
    {
      "type": "next",
      "heading": "次回",
      "title": "第2回 AIで作ったWebアプリは安全？",
      "sub": "初心者が知るべきセキュリティ対策"
    }
  ],
  "ui": {
    "print": "印刷 / PDF保存",
    "lecturePrefix": "第",
    "lectureSuffix": "回",
    "pageSeparator": " / "
  }
};</script>

<style>
:root{color-scheme:light;--ink:#14243f;--blue:#1d4ed8;--scale:1}
*{box-sizing:border-box}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.6}button{font:inherit}.toolbar{position:fixed;right:24px;top:16px;z-index:10}.toolbar button{background:#fff;color:var(--ink);border:1px solid #d9dce2;border-radius:8px;padding:8px 18px;font-size:16px;cursor:pointer;box-shadow:0 3px 14px #14243f0a}.toolbar button:focus-visible{outline:3px solid var(--blue);outline-offset:4px}.slide{position:relative;min-height:100vh;height:100vh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);place-items:center;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;border-bottom:1px solid #eef0f3}.frame{position:relative;width:1280px;height:720px;flex:none;transform:scale(var(--scale));transform-origin:center;background:#fff;padding:100px 80px 76px;display:flex;flex-direction:column;justify-content:center}.page{position:absolute;top:32px;left:48px;font-size:18px;letter-spacing:.08em;color:#586275}.brand{position:absolute;right:48px;bottom:28px;font-size:18px;color:#586275}.content{width:100%}h1,h2,h3,p{margin:0}h1{font-size:64px;line-height:1.35;letter-spacing:-.035em}h2{font-size:44px;line-height:1.4;letter-spacing:-.025em;margin-bottom:36px}h3{font-size:30px;line-height:1.5;font-weight:700}p,li,td,th{font-size:28px;line-height:1.7}p{overflow-wrap:anywhere}.kicker{font-size:28px;margin-bottom:26px;color:var(--blue)}.subtitle{font-size:36px;margin-top:28px}.big{font-size:56px;line-height:1.5;font-weight:700;letter-spacing:-.025em;overflow-wrap:anywhere}.sub{margin-top:30px;max-width:1060px}.rule{width:64px;height:4px;background:var(--blue);margin-bottom:32px}.cards{display:grid;gap:24px}.cards.two{grid-template-columns:repeat(2,1fr)}.cards.three{grid-template-columns:repeat(3,1fr)}.card{padding:28px;border:1px solid #e0e3e8;border-radius:14px;background:#fff;box-shadow:0 8px 28px #14243f06}.card p{margin-top:16px}.label{font-size:28px;color:#586275;margin-bottom:18px}.card h3{font-size:32px}.number{color:var(--blue);font-size:28px;font-weight:700;margin-bottom:18px}.rows{list-style:none;padding:0;margin:0;display:grid;gap:22px}.row{display:grid;grid-template-columns:48px 1fr;gap:22px;align-items:start}.row .number{margin:0;font-size:30px}.row p{margin-top:2px}.goal .rows{gap:30px}.goal li{font-size:36px}.flow-list{display:flex;align-items:flex-start;list-style:none;padding:0;margin:34px 0 0;gap:0}.flow-list li{border-top:2px solid #d9dce2;padding-top:22px;flex:1;min-width:0}.flow-list li.flow-arrow{flex:0 0 40px;border-top:none;display:flex;justify-content:center;padding-top:16px;font-size:28px;color:var(--blue)}.flow-list .number{display:block}.flow-list p{font-size:28px}.flow h2{margin-bottom:14px}table{border-collapse:collapse;width:100%;table-layout:fixed}th{text-align:left;font-size:30px;padding:18px 24px;border-bottom:2px solid var(--ink)}td{padding:18px 24px;border-bottom:1px solid #e0e3e8}th+th,td+td{border-left:1px solid #e0e3e8}.scenes .card{padding:20px 26px}.scenes .card p{margin:8px 0 0}.scenes .label{font-size:28px;margin:0;color:var(--blue)}.caution h3{font-size:30px}.caution .rows{gap:20px}.next .kicker{margin-bottom:20px}.next h2{font-size:56px}.todo .big{max-width:1060px}.title .content{max-width:1080px}

<body>
<div class="toolbar"></div>
<main id="deck"></main>
<script>
'use strict';
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const append=(parent,...children)=>{parent.append(...children);return parent;};
const heading=s=>el('h2','',s.heading);
const card=item=>append(el('article','card'),el('h3','',item.title),el('p','',item.desc));
const numbered=(items,goal=false)=>{const list=el('ol','rows');items.forEach((item,i)=>{const row=el('li','row');row.append(el('span','number',String(i+1).padStart(2,'0')));row.append(goal?el('span','',item):append(el('div'),el('h3','',item.title),el('p','',item.desc)));list.append(row);});return list;};
const renderers={
 title:()=>[el('p','kicker',LECTURE.series+' / '+LECTURE.ui.lecturePrefix+LECTURE.no+LECTURE.ui.lectureSuffix),el('div','rule'),el('h1','',LECTURE.title),el('p','subtitle',LECTURE.subtitle)],
 goal:s=>[heading(s),numbered(s.items,true)],
 statement:s=>[el('div','rule'),el('h2','big',s.big),el('p','sub',s.sub)],
 metaphor:s=>[heading(s),append(el('div','cards two'),...[s.left,s.right].map(item=>append(el('article','card'),el('p','label',item.label),el('h3','',item.title),el('p','',item.desc))))],
 three:s=>[heading(s),append(el('div','cards three'),...s.items.map((item,i)=>{const c=card(item);c.prepend(el('div','number',String(i+1).padStart(2,'0')));return c;}))],
 flow:s=>[heading(s),el('p','',s.sub),append(el('ol','flow-list'),...s.steps.reduce((acc,step,i)=>{if(i)acc.push(el('li','flow-arrow','→'));acc.push(append(el('li'),el('span','number',String(i+1).padStart(2,'0')),el('p','',step)));return acc},[]))],
 table:s=>{const t=el('table');const tr=el('tr');s.cols.forEach(col=>{const th=el('th','',col);th.scope='col';tr.append(th);});t.append(append(el('thead'),tr));t.append(append(el('tbody'),...s.rows.map(row=>append(el('tr'),...row.map(value=>el('td','',value))))));return[heading(s),t];},
 steps:s=>[heading(s),numbered(s.items)],
 scenes:s=>[heading(s),append(el('div','cards two'),...s.items.map(item=>append(el('article','card'),el('h3','label',item.who),el('p','',item.text))))],
 caution:s=>[heading(s),numbered(s.items)],
 todo:s=>[el('p','kicker',s.heading),el('div','rule'),el('h2','big',s.big),el('p','sub',s.sub)],
 next:s=>[el('p','kicker',s.heading),el('div','rule'),el('h2','',s.title),el('p','subtitle',s.sub)]
};
document.title=LECTURE.title+' | '+LECTURE.school;
const printButton=el('button','',LECTURE.ui.print);printButton.type='button';printButton.addEventListener('click',()=>window.print());document.querySelector('.toolbar').append(printButton);
LECTURE.slides.forEach((slide,i)=>{const section=el('section','slide '+slide.type);section.id='slide-'+(i+1);section.setAttribute('aria-label',(i+1)+LECTURE.ui.pageSeparator+LECTURE.slides.length);const frame=el('div','frame');frame.append(el('div','page',(i+1)+LECTURE.ui.pageSeparator+LECTURE.slides.length),append(el('div','content'),...renderers[slide.type](slide)),el('footer','brand',LECTURE.school));section.append(frame);document.querySelector('#deck').append(section);});
function resize(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1280,innerHeight/720));}
addEventListener('resize',resize);resize();
addEventListener('keydown',event=>{if(event.target.closest('button,input,textarea,select')||event.altKey||event.ctrlKey||event.metaKey)return;const forward=event.key==='ArrowRight'||(event.code==='Space'&&!event.shiftKey);const backward=event.key==='ArrowLeft'||(event.code==='Space'&&event.shiftKey);if(!forward&&!backward)return;event.preventDefault();const current=Math.round(scrollY/innerHeight);document.querySelectorAll('.slide')[Math.max(0,Math.min(LECTURE.slides.length-1,current+(forward?1:-1)))].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
</script>
</body>
